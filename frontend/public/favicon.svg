<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Glow Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Main Medical Cross Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar of Cross -->
    <rect x="216" y="116" width="80" height="280" rx="24" fill="#ffffff"/>
    <!-- Horizontal Bar of Cross -->
    <rect x="116" y="216" width="280" height="80" rx="24" fill="#ffffff"/>
  </g>

  <!-- Green Emerald Pill Capsule Accent in Center -->
  <g transform="rotate(45 256 256)">
    <!-- Left Capsule Half (Emerald) -->
    <path d="M 206 226 A 30 30 0 0 1 206 286 L 256 286 L 256 226 Z" fill="url(#accent)"/>
    <!-- Right Capsule Half (Cyan) -->
    <path d="M 256 226 L 306 226 A 30 30 0 0 1 306 286 L 256 286 Z" fill="#38bdf8"/>
    <!-- Pill Divider -->
    <line x1="256" y1="226" x2="256" y2="286" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Leaf / Certified Health Dot -->
  <circle cx="370" cy="142" r="28" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
</svg>
